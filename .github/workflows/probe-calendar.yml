# Temporary: prints the court's calendar pages so the calendar reader can be fitted to them. Runs only on this branch.
name: Probe court calendar
on:
  push:
    branches: [claude/edla-analyzer-handoff-mxkn8y]
    paths: [.github/workflows/probe-calendar.yml, scripts/probe_calendar.py]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u scripts/probe_calendar.py
