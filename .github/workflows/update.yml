name: Update docket data

on:
  schedule:
    # Times are UTC; Central is UTC-5 (CDT) or UTC-6 (CST).
    # Weekday working hours, every 15 minutes: 7:00 AM to 9:45 PM Central.
    - cron: "*/15 12-23 * * 1-5"
    - cron: "*/15 0-2 * * 2-6"
    # Every other hour of the week, hourly, so the backlog keeps draining and no gap goes unwatched:
    # overnight every day (10:07 PM to 6:07 AM Central) ...
    - cron: "7 3-11 * * *"
    # ... and weekend days and evenings (Saturday and Sunday 7:07 AM to 9:07 PM Central).
    - cron: "7 12-23 * * 0,6"
    - cron: "7 0-2 * * 0,1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the PDF reader
        run: pip install --quiet pypdf==5.4.0

      - name: Fetch new entries
        env:
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
          # Rate limits for the key. Leave unset for a free account (5 a minute, 50 an hour, 125 a day);
          # after a CourtListener membership, set these repository variables to the new limits.
          COURTLISTENER_PER_MINUTE: ${{ vars.COURTLISTENER_PER_MINUTE }}
          COURTLISTENER_PER_HOUR: ${{ vars.COURTLISTENER_PER_HOUR }}
          COURTLISTENER_PER_DAY: ${{ vars.COURTLISTENER_PER_DAY }}
          COURTLISTENER_SEARCH_MINUTES: ${{ vars.COURTLISTENER_SEARCH_MINUTES }}
        run: python -u scripts/update.py

      - name: Commit when the data changed
        run: |
          # Commit when data changed, or when the run log carries something later runs need: a CourtListener
          # pause, or calls that count against the hourly and daily limits.
          if git diff --quiet -- data/orders.json data/opinions.json data/link_checks.json data/outcomes.json data/motions.json data/govinfo.json \
             && ! python3 -c "import json,sys; r=json.load(open('data/runs.json'))[-1]; sys.exit(0 if r.get('cl_paused_until') or r.get('cl_calls') else 1)"; then
            echo "No new entries."
            git checkout -- data
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)"
          # main may have moved during the run (a merge, or the outcome workflow); rebase the data commit onto it.
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          echo "Could not push after 4 tries" >&2
          exit 1
