name: Update docket data

on:
  schedule:
    # GitHub runs frequent schedules only about once an hour on a small repository, so each run checks the feed
    # four times, about 15 minutes apart (see the loop below). Times are UTC; this asks for every hour, all week.
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the PDF reader
        run: pip install --quiet pypdf==5.4.0

      - name: Fetch new entries four times, about 15 minutes apart, and commit after each
        env:
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}
          # Rate limits for the key. Leave unset for a free account (5 a minute, 50 an hour, 125 a day);
          # after a CourtListener membership, set these repository variables to the new limits.
          COURTLISTENER_PER_MINUTE: ${{ vars.COURTLISTENER_PER_MINUTE }}
          COURTLISTENER_PER_HOUR: ${{ vars.COURTLISTENER_PER_HOUR }}
          COURTLISTENER_PER_DAY: ${{ vars.COURTLISTENER_PER_DAY }}
          COURTLISTENER_SEARCH_MINUTES: ${{ vars.COURTLISTENER_SEARCH_MINUTES }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit() {
            # Commit when data changed, or when the run log carries something later runs need: a CourtListener
            # pause, or calls that count against the hourly and daily limits.
            if git diff --quiet -- data/orders.json data/opinions.json data/link_checks.json data/outcomes.json data/motions.json data/govinfo.json data/feed.json \
               && ! python3 -c "import json,sys; r=json.load(open('data/runs.json'))[-1]; sys.exit(0 if r.get('cl_paused_until') or r.get('cl_calls') else 1)"; then
              echo "No new entries."
              git checkout -- data
              return 0
            fi
            git add data
            git commit -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)"
            # main may have moved (a merge, or another workflow); rebase the data commit onto it.
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push && return 0
              sleep $((i * 5))
            done
            echo "Could not push after 4 tries" >&2
            return 1
          }
          for pass in 1 2 3 4; do
            echo "::group::Pass $pass of 4, $(date -u +%H:%M) UTC"
            git pull --rebase origin main
            python -u scripts/update.py
            commit
            echo "::endgroup::"
            if [ "$pass" -lt 4 ]; then sleep 840; fi
          done
