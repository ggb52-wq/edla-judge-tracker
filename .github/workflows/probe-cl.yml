name: Probe CourtListener opinions (temporary)
on:
  push:
    branches: [claude/edla-analyzer-handoff-mxkn8y]
    paths: [scripts/probe_cl.py, .github/workflows/probe-cl.yml]
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -u scripts/probe_cl.py
        env:
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
