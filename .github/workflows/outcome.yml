name: Record outcome

# Records a hand-entered outcome when the repository owner opens or edits an "Outcome:" issue
# (see .github/ISSUE_TEMPLATE/outcome.yml). Issues from anyone else are ignored.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: record-outcome
  cancel-in-progress: false

jobs:
  record:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Outcome')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record the outcome
        id: record
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          RESULT_FILE: ${{ runner.temp }}/result.txt
        run: python scripts/record_outcome.py

      - name: Commit and push
        if: success()
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git diff --quiet -- data/outcomes.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/outcomes.json
          git commit -m "Record outcome from issue #${ISSUE_NUMBER}"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1

      - name: Reply and close
        if: always() && steps.record.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT_FILE: ${{ runner.temp }}/result.txt
          OK: ${{ job.status == 'success' }}
        run: |
          [ -f "$RESULT_FILE" ] || echo "Not recorded: the workflow failed before reading the form." > "$RESULT_FILE"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RESULT_FILE"
          if [ "$OK" = "true" ]; then gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"; fi
