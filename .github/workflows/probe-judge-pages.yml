# Temporary: runs the judge-page reader on this branch and commits its first copy here. Removed before merging.
name: Probe judge pages
on:
  push:
    branches: [claude/edla-analyzer-handoff-mxkn8y]
    paths: [.github/workflows/probe-judge-pages.yml, scripts/judge_pages.py]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the judge pages
        run: python -u scripts/judge_pages.py
      - name: Commit to this branch
        run: |
          git add data/judge_pages.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Judge pages: first read"
          git push origin HEAD:claude/edla-analyzer-handoff-mxkn8y
