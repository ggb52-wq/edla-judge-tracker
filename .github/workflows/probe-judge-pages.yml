# Temporary: prints the structure of the court's judge pages so the scraper can be fitted to them. Runs only on this branch.
name: Probe judge pages
on:
  push:
    branches: [claude/edla-analyzer-handoff-mxkn8y]
    paths: [.github/workflows/probe-judge-pages.yml, scripts/probe_judge_pages.py]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u scripts/probe_judge_pages.py
