# Temporary: runs the judge-page reader on this branch and commits its first copy here. Removed before merging.
name: Probe judge pages
on:
  push:
    branches: [claude/edla-analyzer-handoff-mxkn8y]
    paths: [.github/workflows/probe-judge-pages.yml, scripts/judge_pages.py]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Look for judge-specific documents elsewhere on the site
        run: |
          python -u - <<'PY'
          import re, sys, urllib.request
          sys.path.insert(0, "scripts")
          import judge_pages as jp
          for url in [jp.BASE + "/forms/all-forms", jp.BASE + "/localrules/localrules.htm", jp.BASE + "/court-information/general-orders", jp.BASE + "/judges-information/district-judges"]:
              try:
                  html = jp.fetch(url)
              except Exception as e:
                  print("ERR", url, e); continue
              root = jp.parse(html)
              print("==", url, len(html))
              for a in root.find_all(lambda n: n.tag == "a"):
                  t = jp.clean(a.text()); h = a.attrs.get("href", "")
                  if re.search(r"judge|section [a-z]\b|standing|chambers|procedure|requirement|scheduling", t + " " + h, re.I):
                      print("  ", repr(t[:90]), "->", h[:140])
          PY
      - name: Read the judge pages
        run: python -u scripts/judge_pages.py
      - name: Commit to this branch
        run: |
          git add data/judge_pages.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Judge pages: first read"
          git push origin HEAD:claude/edla-analyzer-handoff-mxkn8y
