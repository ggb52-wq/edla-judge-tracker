name: Probe new sources (temporary)
on:
  push:
    branches: [claude/edla-analyzer-handoff-mxkn8y]
    paths: [scripts/probe_sources.py, .github/workflows/probe-sources.yml]
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet pypdf==5.4.0
      - run: python -u scripts/probe_sources.py
        env:
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
